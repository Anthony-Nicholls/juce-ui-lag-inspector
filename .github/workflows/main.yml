name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: lukka/get-cmake@latest

      - name: Update apt-get
        run: sudo apt-get update

      - name: Install compiler dependencies
        run: sudo apt-get install -y build-essential

      - name: Install JUCE dependencies
        run: |
          sudo apt-get install -y \
            libasound2-dev \
            ladspa-sdk \
            libfreetype-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxrender-dev \
            libglu1-mesa-dev \
            mesa-common-dev

      - name: Configure
        run: |
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCOPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build

      - name: Set release version
        run: |
          cmake --build build --target print-version
          VERSION=$(cat build/version.txt)
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=UILagInspector (Linux v${VERSION}).zip" >> $GITHUB_ENV

      - name: Create release archive
        shell: bash
        run: |
          python scripts/package.py build/UILagInspector_artefacts/Release "${{ env.ARCHIVE_NAME }}").zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: lukka/get-cmake@latest

      - name: Configure
        shell: bash
        run: |
          cmake -Bbuild -G"Visual Studio 17 2022" -A x64 \
            -DCOPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Set release version
        run: |
          cmake --build build --target print-version
          VERSION=$(cat build/version.txt)
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=UILagInspector (Windows v${VERSION}).zip" >> $GITHUB_ENV

      - name: Create release archive
        shell: bash
        run: |
          python scripts/package.py build/UILagInspector_artefacts/Release "${{ env.ARCHIVE_NAME }}").zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: lukka/get-cmake@latest

      - name: Configure
        run: |
          cmake -Bbuild -GNinja -DCMAKE_BUILD_TYPE=Release \
            -DCOPY_PLUGIN_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build

      - name: Set release version
        run: |
          cmake --build build --target print-version
          VERSION=$(cat build/version.txt)
          echo "PROJECT_VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCHIVE_NAME=UILagInspector (macOS v${VERSION}).zip" >> $GITHUB_ENV

      - name: Create release archive
        shell: bash
        run: |
          python scripts/package.py build/UILagInspector_artefacts/Release "${{ env.ARCHIVE_NAME }}").zip"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

